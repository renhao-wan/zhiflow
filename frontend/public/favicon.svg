<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- 知流品牌标记：墨底 + 冷雾白 Z，靛蓝强调点呼应"流"，统一冷墨档案 -->
  <rect width="64" height="64" rx="16" fill="#1c232b"/>
  <!-- 品牌字母标 Z：三段硬边横折，等宽粗笔画，直角转折 -->
  <path
    d="M20 16h24M44 16l-24 32M20 48h24"
    fill="none"
    stroke="#f8f9fb"
    stroke-linecap="square"
    stroke-linejoin="miter"
    stroke-width="6"
  />
  <!-- 靛蓝强调点：呼应"流"，替代原项目陶土红 -->
  <circle cx="46" cy="50" r="5" fill="#3b5bdb"/>
</svg>
